name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start application
        working-directory: ./automation-framework
        run: |
          mvn spring-boot:run > /tmp/banking-app.log 2>&1 &
          ready=false
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/banking-app.log
            exit 1
          fi

      - name: Run tests
        working-directory: ./automation-framework
        run: mvn test --batch-mode

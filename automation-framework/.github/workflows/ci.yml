name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start application
        working-directory: ./automation-framework
        run: |
          mvn spring-boot:run > /tmp/banking-app.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://localhost:8080/ >/dev/null && break
            sleep 2
          done

      - name: Run tests
        working-directory: ./automation-framework
        run: mvn test --batch-mode

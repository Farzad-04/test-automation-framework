name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation-framework/frontend/package-lock.json

      - name: Build React dashboard
        working-directory: ./automation-framework/frontend
        run: npm ci && npm run build

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start application
        working-directory: ./automation-framework
        run: |
          mvn spring-boot:run > /tmp/banking-app.log 2>&1 &
          ready=false
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/banking-app.log
            exit 1
          fi

      - name: Run tests
        working-directory: ./automation-framework
        run: mvn test --batch-mode -Dui.headless=true

      - name: Upload E2E screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-e2e-report
          path: automation-framework/target/e2e-report/
          if-no-files-found: warn
          retention-days: 14
